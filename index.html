<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Newton — immersive 3D web experiences built with motion, neon glass, interactive design, and code."
    />
    <meta
      name="keywords"
      content="3D web design, motion graphics, interactive design, Spline, neon glass, Newton"
    />
    <meta name="author" content="Newton Labs" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#05060f" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Newton — Immersive 3D Web Experiences"
    />
    <meta
      property="og:description"
      content="Discover Newton's cutting-edge 3D web designs combining motion, neon glass, and interactive experiences."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:title"
      content="Newton — Immersive 3D Web Experiences"
    />
    <meta
      property="twitter:description"
      content="Discover Newton's cutting-edge 3D web designs combining motion, neon glass, and interactive experiences."
    />

    <title>Newton — Immersive 3D Web Experiences</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Remix Icon -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <!-- Custom Styles -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Gruppo&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Sen:wght@400..800&display=swap");

      :root {
        --neon-cyan: #00f0ff;
        --neon-violet: #7c3aed;
        --neon-magenta: #ff2e9a;
      }

      .nav-link {
        position: relative;
        text-decoration: none;
      }

      .nav-link::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 1px;
        bottom: -4px;
        left: 0;
        background: linear-gradient(
          90deg,
          var(--neon-cyan),
          var(--neon-magenta)
        );
        box-shadow: 0 0 8px var(--neon-cyan);
        transform: scaleX(0);
        transform-origin: bottom left;
        transition: transform 0.3s ease-out;
      }

      .nav-link:hover::after {
        transform: scaleX(1);
      }

      #mobile-gif {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .glass-effect {
        background: rgba(10, 12, 30, 0.5);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 14px;
        border: 1px solid rgba(0, 240, 255, 0.22);
        padding: 20px;
        box-shadow:
          0 4px 24px rgba(0, 0, 0, 0.35),
          0 0 32px rgba(0, 240, 255, 0.08);
      }

      .neon-text {
        background: linear-gradient(
          90deg,
          var(--neon-cyan),
          var(--neon-violet),
          var(--neon-magenta)
        );
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: neon-shimmer 5s linear infinite;
        filter: drop-shadow(0 0 22px rgba(0, 240, 255, 0.45));
      }

      @keyframes neon-shimmer {
        to {
          background-position: 220% 0;
        }
      }

      .neon-btn {
        border: 1px solid rgba(0, 240, 255, 0.55);
        box-shadow: 0 0 18px rgba(0, 240, 255, 0.18);
        transition: all 0.3s ease;
      }

      .neon-btn:hover {
        background: rgba(0, 240, 255, 0.12);
        box-shadow: 0 0 34px rgba(0, 240, 255, 0.45);
        border-color: var(--neon-cyan);
      }

      .brand-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-left: 8px;
        background: linear-gradient(135deg, var(--neon-cyan), var(--neon-violet));
        box-shadow: 0 0 12px var(--neon-cyan);
        animation: brand-pulse 2.4s ease-in-out infinite;
      }

      @keyframes brand-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.5);
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body class="bg-black text-white font-['Gruppo',sans-serif] overflow-hidden">
    <nav class="absolute top-0 left-0 right-0 z-20">
      <div
        class="container mx-auto px-4 md:px-10 py-4 md:py-10 flex justify-between items-center"
      >
        <div class="text-2xl font-bold tracking-widest">
          NEWTON<span class="brand-dot"></span>
        </div>
        <div class="hidden md:flex space-x-8 glass-effect">
          <a href="#" class="nav-link">Home</a>
          <a href="#" class="nav-link">Engine</a>
          <a href="#" class="nav-link">Showcase</a>
          <a href="#" class="nav-link">Resources</a>
        </div>
        <button
          class="hidden md:block neon-btn border rounded-full px-4 py-2 transition"
        >
          Let's Talk
        </button>
        <button
          id="menu-toggle"
          class="md:hidden text-white border border-white/50 rounded-full px-3 py-1 hover:bg-white/10 transition focus:outline-none"
        >
          <i class="ri-menu-3-line text-xl"></i>
        </button>
      </div>
    </nav>

    <div
      id="mobile-menu"
      class="fixed inset-0 bg-black bg-opacity-90 z-30 hidden flex-col justify-center items-center px-4 md:px-10 glass-effect"
    >
      <button
        id="close-menu"
        class="absolute top-4 right-4 text-white border border-white/50 rounded-full px-3 py-1 hover:bg-white/10 transition focus:outline-none"
      >
        <i class="ri-close-line text-xl"></i>
      </button>
      <a
        href="#"
        class="text-2xl my-4 hover:text-gray-300 transition-colors duration-300"
        >Home</a
      >
      <a
        href="#"
        class="text-2xl my-4 hover:text-gray-300 transition-colors duration-300"
        >Engine</a
      >
      <a
        href="#"
        class="text-2xl my-4 hover:text-gray-300 transition-colors duration-300"
        >Showcase</a
      >
      <a
        href="#"
        class="text-2xl my-4 hover:text-gray-300 transition-colors duration-300"
        >Resources</a
      >
      <button
        class="mt-8 neon-btn border rounded-full px-6 py-3 transition text-xl"
      >
        Let's Talk
      </button>
    </div>

    <div class="relative w-full h-screen">
      <spline-viewer
        url="https://prod.spline.design/WNmhHpS4PLU16Rji/scene.splinecode"
        class="w-full h-full hidden md:block"
      ></spline-viewer>

      <img
        id="mobile-gif"
        src="animation.gif"
        alt="Animated 3D scene"
        class="w-full h-full object-cover md:hidden"
      />

      <div class="absolute inset-0 pointer-events-none">
        <div
          class="container mx-auto h-full flex flex-col justify-end px-4 md:px-10 py-4 md:py-10"
        >
          <div
            class="flex flex-col md:flex-row justify-between items-start md:items-end"
          >
            <div class="mb-8 md:mb-0 max-w-full md:max-w-[50%] glass-effect">
              <h1
                class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl xl:text-[5rem] font-['Sen',sans-serif] font-normal leading-none tracking-tighter mb-4"
              >
                Design Beyond<br /><span class="neon-text">Reality</span>
              </h1>
              <p class="text-xs sm:text-sm md:text-base tracking-widest">
                3D \ MOTION \ NEON GLASS \ INTERACTIVE \ DESIGN \ CODE
              </p>
            </div>

            <div class="w-full md:w-auto md:text-left glass-effect">
              <p
                class="text-sm sm:text-base md:text-lg lg:text-xl mb-4 md:mb-8"
              >
                Crafting Immersive Worlds and Neon-Glass
                <br class="hidden md:inline" />
                Interfaces to Make Your Brand Stand Out
              </p>
              <div
                class="flex flex-col sm:flex-row md:flex-col lg:flex-row space-y-2 sm:space-y-0 sm:space-x-4 md:space-x-0 md:space-y-2 lg:space-y-0 lg:space-x-4 md:items-end"
              >
                <button
                  class="pointer-events-auto neon-btn text-xs sm:text-sm md:text-base border rounded-full px-3 py-1 md:px-4 md:py-2 transition w-full sm:w-auto"
                >
                  Learn More
                </button>
                <button
                  class="pointer-events-auto neon-btn text-xs sm:text-sm md:text-base border rounded-full px-3 py-1 md:px-4 md:py-2 transition w-full sm:w-auto"
                >
                  Contact Us
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="https://unpkg.com/@splinetool/viewer@1.7.6/build/spline-viewer.js"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
